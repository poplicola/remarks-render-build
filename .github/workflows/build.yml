name: Build remarks-render.exe (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-remarks-render.yml

jobs:
  build:
    runs-on: windows-latest  # x64 — has prebuilt PyMuPDF + brotli wheels, no MSVC needed
    timeout-minutes: 30

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install poetry
        run: python -m pip install --upgrade pip poetry

      - name: Clone Scrybbling-together/remarks
        run: git clone --depth 1 https://github.com/Scrybbling-together/remarks remarks-src

      - name: Install remarks deps
        working-directory: remarks-src
        run: poetry install --no-root

      - name: Write the lazy-import patch script
        working-directory: remarks-src
        shell: bash
        run: |
          # rmc and remarks both eagerly do `from rmc.exporters.pdf import rm_to_pdf`,
          # which imports cairosvg, which dlopens libcairo-2.dll — not present on
          # Windows runners. Annotated-PDF rendering uses PyMuPDF, not this path,
          # so deferring the import until actually called avoids the build-time
          # ImportError without affecting the priority use case (PDF + annotations).
          cat > _patch_imports.py <<'PY'
          import pathlib, importlib.util
          # Locate rmc/__init__.py WITHOUT importing rmc (importing would re-trigger
          # the cairosvg import chain we're patching out).
          spec = importlib.util.find_spec("rmc")
          if spec is None or spec.origin is None:
              raise SystemExit("rmc not findable on sys.path")
          rmc_init = pathlib.Path(spec.origin)
          for path in [
              rmc_init,
              pathlib.Path("remarks") / "remarks.py",
          ]:
              src = path.read_text(encoding="utf-8")
              if path.name == "remarks.py":
                  old = "from rmc.exporters.pdf import rm_to_pdf"
                  new = ("def rm_to_pdf(*a, **kw):\n"
                         "    from rmc.exporters.pdf import rm_to_pdf as _impl\n"
                         "    return _impl(*a, **kw)")
              else:
                  old = "from .exporters.pdf import rm_to_pdf"
                  new = ("def rm_to_pdf(*a, **kw):\n"
                         "    from .exporters.pdf import rm_to_pdf as _impl\n"
                         "    return _impl(*a, **kw)")
              if old not in src:
                  print(f"NOTE: pattern not found in {path}, skipping")
                  continue
              path.write_text(src.replace(old, new), encoding="utf-8")
              print(f"Patched {path}")
          PY

      - name: Apply lazy-import patch
        working-directory: remarks-src
        run: poetry run python _patch_imports.py

      - name: Install PyInstaller
        working-directory: remarks-src
        run: poetry run pip install pyinstaller

      - name: Build remarks-render.exe
        working-directory: remarks-src
        run: |
          poetry run pyinstaller --onefile --name remarks-render --clean `
            --collect-all rmscene `
            --collect-all rmc `
            --collect-all remarks `
            --collect-data remarks `
            --add-data "remarks/output;remarks/output" `
            remarks/__main__.py

      - name: Smoke-test the binary
        working-directory: remarks-src
        run: |
          .\dist\remarks-render.exe --help
          if ($LASTEXITCODE -ne 0) { throw "remarks-render exited $LASTEXITCODE" }
          (Get-Item .\dist\remarks-render.exe).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remarks-render-windows-x64
          path: remarks-src/dist/remarks-render.exe
          retention-days: 30
          compression-level: 9
